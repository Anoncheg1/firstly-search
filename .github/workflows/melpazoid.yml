# melpazoid <https://github.com/riscy/melpazoid> build checks.

# If your package is on GitHub, enable melpazoid's checks by copying this file
# to .github/workflows/melpazoid.yml and modifying RECIPE and EXIST_OK below.
---
name: melpazoid
'on': [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 29.1
          # - 29.2
          # - 29.3
          - 29.4
          - 30.1
          - 31.1
          # - release-snapshot
    steps:
      - name: Get repo to access in conteiner
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install melpazoid
        run: |
          python -m pip install --upgrade pip
          # sudo apt-get install emacs-nox && emacs --version
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
          pip install ~/melpazoid

      - name: Install Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Tests
        run: |
         emacs -Q --batch --no-site-file -l ert.el -l firstly-search.el -l firstly-search-tests.el -f ert-run-tests-batch-and-exit || exit 1

      - name: Run melpazoid tests
        env:
          LOCAL_REPO: ${{ github.workspace }}
          # RECIPE is your recipe as written for MELPA:
          RECIPE: (firstly-search :fetcher github :repo "Anoncheg1/firstly-search")
          # set this to false (or remove it) if the package isn't on MELPA:
          EXIST_OK: true
        run: |
          echo $GITHUB_REF
          make -C ~/melpazoid 2>&1 | tee output.log
          MAKE_EXIT=$?
          [ $MAKE_EXIT -ne 0 ] && { echo "Make command failed, failing workflow"; exit 1; }

          # Strip ANSI codes for clean analysis
          sed -i 's/\x1b\[[0-9;]*m//g' output.log

          if grep "Warning" output.log | grep -v check-declare |  grep -q . ; then
            echo "Warnings detected, failing workflow" ; exit 1
          fi
          if grep ': error: ' output.log | grep -q . ; then
            echo "Error detected, failing workflow" ; exit 1
          fi

          if grep -E ' with .?melpazoid' output.log | grep -q . ; then
            grep -E ' with .?melpazoid' output.log
            echo "Melpazoid warning detected, failing workflow" ; exit 1
          fi
          if grep ' with package-lint ' output.log | grep -q . ; then
            echo "package-lint Warnings detected, failing workflow" ; exit 1
          fi
          if grep ' with checkdoc ' output.log | grep -q . ; then
            echo "Checkdoc warning detected, failing workflow" ; exit 1
          fi
          echo "normal"
